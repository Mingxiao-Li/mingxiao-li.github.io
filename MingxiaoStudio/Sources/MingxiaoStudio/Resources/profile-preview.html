<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root { color-scheme: light; --paper: #fbfaf7; --ink: #252a2d; --muted: #687078; --line: #d9dedf; --accent: #8e3329; --jade: #55756c; }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--paper); font: 14px/1.72 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      a { color: var(--accent); }
      .page { max-width: 780px; min-height: 100vh; margin: auto; padding: 0 30px 70px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 58px; border-bottom: 1px solid var(--line); }
      .brand { color: var(--ink); font: 600 18px/1 Georgia, serif; }
      .brand::before { display: inline-block; width: 8px; height: 8px; margin-right: 9px; background: var(--accent); content: ""; }
      .nav { display: flex; gap: 15px; color: var(--muted); font: 10px/1 "SFMono-Regular", Consolas, monospace; letter-spacing: .04em; text-transform: uppercase; }
      .nav a { color: var(--muted); text-decoration: none; }
      .nav a:hover, .nav a:focus-visible { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
      .profile { display: grid; grid-template-columns: minmax(0, 1fr) 126px; gap: 40px; align-items: start; padding: 60px 0 52px; }
      .eyebrow { margin: 0 0 15px; color: var(--jade); font: 10px/1.3 "SFMono-Regular", Consolas, monospace; letter-spacing: .07em; text-transform: uppercase; }
      h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; letter-spacing: -.045em; }
      h1 { margin: 0; font-size: clamp(45px, 8vw, 73px); line-height: .95; }
      h2 { margin: 0 0 14px; font-size: 26px; line-height: 1.15; }
      .lead { max-width: 510px; margin: 23px 0 17px; font: 20px/1.42 Georgia, serif; }
      .copy p:not(.eyebrow):not(.lead) { max-width: 540px; margin: 0 0 15px; color: var(--muted); }
      .links { display: flex; flex-wrap: wrap; gap: 5px 15px; margin-top: 24px !important; font: 10px/1.3 "SFMono-Regular", Consolas, monospace; }
      .links a { text-decoration-thickness: 1px; text-underline-offset: 3px; }
      .portrait { width: 126px; margin: 4px 0 0; }
      .portrait img { display: block; width: 100%; height: auto; border: 1px solid var(--line); background: #f2efe8; }
      .portrait figcaption { margin-top: 8px; color: var(--muted); font: 9px/1.2 "SFMono-Regular", Consolas, monospace; text-align: center; text-transform: uppercase; }
      .section { padding: 38px 0 42px; border-top: 1px solid var(--line); }
      .section p { max-width: 600px; margin: 0; color: var(--muted); }
      .rows { margin-top: 20px; border-top: 1px solid var(--line); }
      .row { display: grid; grid-template-columns: 150px 1fr; gap: 17px; padding: 12px 0; border-bottom: 1px solid var(--line); }
      .row strong { font: 16px/1.35 Georgia, serif; font-weight: 500; }
      .row span { color: var(--muted); font-size: 13px; }
      .notes-list { margin-top: 20px; border-top: 1px solid var(--line); }
      .note { display: grid; grid-template-columns: 92px 1fr auto; gap: 16px; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--line); }
      .note time, .note-tag { color: var(--muted); font: 10px/1.3 "SFMono-Regular", Consolas, monospace; text-transform: uppercase; }
      .note-tag { margin-left: 8px; color: var(--jade); }
      .note h3 { margin: 0; font: 16px/1.35 Georgia, serif; font-weight: 500; }
      .note h3 a { color: var(--ink); text-decoration: none; }
      .note h3 a:hover { color: var(--accent); }
      .note p { margin: 4px 0 0; font-size: 12px; }
      .note-link { color: var(--accent); font: 10px/1.3 "SFMono-Regular", Consolas, monospace; text-decoration: none; white-space: nowrap; }
      .empty-notes { margin-top: 20px !important; padding: 12px 14px; border-left: 3px solid var(--line); background: #f3efe7; font-size: 12px; }
      @media (max-width: 620px) { .page { padding-right: 18px; padding-left: 18px; } .nav { gap: 8px; font-size: 9px; } .profile { grid-template-columns: 1fr; gap: 23px; padding-top: 42px; } .portrait { grid-row: 1; width: 106px; } .copy { grid-row: 2; } .row { grid-template-columns: 1fr; gap: 3px; } .note { grid-template-columns: 1fr; gap: 4px; } .note-link { margin-top: 4px; } }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar"><div class="brand">Mingxiao Li</div><nav class="nav" aria-label="Preview navigation"><a href="#top">Home</a><a href="#research">Research</a><a href="#education">Education</a><a href="#publications">Publications</a><a href="#notes">Notes</a><a href="#service">Service</a><a href="#contact">Contact</a><a href="personal_cv_industry.pdf">CV</a></nav></header>
      <section id="profile" class="profile"></section>
      <section class="section" id="research"></section>
      <section class="section" id="education"></section>
      <section class="section" id="publications"></section>
      <section class="section" id="notes"></section>
      <section class="section" id="service"></section>
      <section class="section" id="contact"></section>
    </main>
    <script>
      const escapeHtml = (value) => String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      const safeURL = (value) => { const url = String(value || ''); return /^(https?:|mailto:)/i.test(url) ? escapeHtml(url) : '#'; };
      const lines = (value) => String(value || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean).map(line => line.split('|').map(part => part.trim()));
      const multiline = (value) => escapeHtml(value || '').replace(/\r?\n/g, '<br>');
      window.renderProfile = (data) => {
        const profile = data?.profile || {};
        const image = data?.imageURL ? `<img src="${escapeHtml(data.imageURL)}" alt="${escapeHtml(profile.photoAlt || 'Portrait')}">` : '';
        const mentor = 'Prof. Marie-Francine Moens';
        const previous = escapeHtml(profile.previousWork || '').replace(escapeHtml(mentor), `<a href="https://people.cs.kuleuven.be/~sien.moens/" target="_blank" rel="noreferrer">${mentor}</a>`);
        document.querySelector('.brand').textContent = profile.name || 'Mingxiao Li';
        document.querySelector('#profile').innerHTML = `<div class="copy"><p class="eyebrow">${escapeHtml(profile.eyebrow)}</p><h1>${escapeHtml(profile.name)}</h1><p class="lead">${escapeHtml(profile.lead)}</p><p>${escapeHtml(profile.currentFocus)}</p><p>${previous}</p><p class="links"><a href="${safeURL(profile.email ? `mailto:${profile.email}` : '')}">Email</a><a href="${safeURL(profile.github)}" target="_blank" rel="noreferrer">GitHub</a><a href="${safeURL(profile.scholar)}" target="_blank" rel="noreferrer">Google Scholar</a><a href="${safeURL(profile.zhihu)}" target="_blank" rel="noreferrer">Zhihu</a></p></div><figure class="portrait">${image}<figcaption>${escapeHtml(profile.photoCaption || '')}</figcaption></figure>`;
        const researchRows = lines(profile.researchItems).map(parts => `<div class="row"><strong>${escapeHtml(parts[0] || '')}</strong><span>${escapeHtml(parts.slice(1).join(' | '))}</span></div>`).join('');
        document.querySelector('#research').innerHTML = `<h2>${escapeHtml(profile.researchHeading || 'Research')}</h2><p>${escapeHtml(profile.researchIntro || '')}</p><div class="rows">${researchRows}</div>`;
        const educationRows = lines(profile.educationItems).map(parts => `<div class="row"><strong>${escapeHtml(parts[0] || '')}</strong><span>${escapeHtml(parts.slice(1).join(' · '))}</span></div>`).join('');
        document.querySelector('#education').innerHTML = `<h2>${escapeHtml(profile.educationHeading || 'Education')}</h2><div class="rows">${educationRows}</div>`;
        const publicationRows = lines(profile.publicationItems).map(parts => `<div class="row"><strong>${escapeHtml(parts[0] || '')}</strong><span>${escapeHtml(parts[1] || '')}${parts[2] ? ` <a href="${safeURL(parts[2])}" target="_blank" rel="noreferrer">[Paper]</a>` : ''}</span></div>`).join('');
        document.querySelector('#publications').innerHTML = `<h2>${escapeHtml(profile.publicationsHeading || 'Selected publications')}</h2><div class="rows">${publicationRows}</div>`;
        document.querySelector('#notes').innerHTML = `<h2>${escapeHtml(profile.notesHeading || 'Technical notes')}</h2><p>${escapeHtml(profile.notesIntro || '')}</p><div class="notes-list"><article class="note"><time>Published</time><div><h3><a href="#">Published notes appear here</a></h3><p>Notes from the site's _posts folder are listed after they are published.</p></div><span class="note-link">Read note ↗</span></article></div>`;
        document.querySelector('#service').innerHTML = `<h2>${escapeHtml(profile.serviceHeading || 'Service & awards')}</h2><div class="rows"><div class="row"><strong>Academic service</strong><span>${multiline(profile.serviceAcademic || '')}</span></div><div class="row"><strong>Awards</strong><span>${multiline(profile.serviceAwards || '')}</span></div></div>`;
        document.querySelector('#contact').innerHTML = `<h2>${escapeHtml(profile.contactHeading || 'Contact')}</h2><p>${escapeHtml(profile.contactIntro || '')}</p><p class="links"><a href="${safeURL(profile.email ? `mailto:${profile.email}` : '')}">${escapeHtml(profile.email || '')}</a></p>`;
      };
    </script>
  </body>
</html>
